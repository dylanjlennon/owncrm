# Runs the same checks as `npm run gate` (without the live project checks) on every push.
name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get install -y -qq postgresql age
      - run: npm ci
      - run: npm run gate
